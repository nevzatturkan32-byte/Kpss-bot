name: KPSS Ilan Tarayici

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri yukle
        run: pip install requests beautifulsoup4

      - name: Ilanlari tara ve gonder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Gonderilenleri kaydet
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "KPSS Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Yeni ilanlar islendi" && git push)
