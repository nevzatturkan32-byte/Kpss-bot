<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>KPSS P94 & Belediye İlan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 40px; }
    header { background: #1e293b; padding: 18px 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #334155; }
    h1 { font-size: 19px; font-weight: 700; color: #38bdf8; }
    .sub { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .controls { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; outline: none; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; }
    .tab { padding: 7px 13px; border-radius: 20px; background: #1e293b; color: #cbd5e1; font-size: 12px; font-weight: 600; border: 1px solid #334155; white-space: nowrap; cursor: pointer; }
    .tab.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .list { padding: 4px 16px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #0369a1; color: #e0f2fe; }
    .date { font-size: 11px; color: #94a3b8; }
    .title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; color: #f1f5f9; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pill { font-size: 11px; background: #0f172a; padding: 4px 8px; border-radius: 6px; color: #38bdf8; border: 1px solid #334155; }
    .desc { font-size: 12px; color: #94a3b8; line-height: 1.45; margin-bottom: 12px; }
    .btns { display: flex; gap: 8px; }
    .btn { flex: 1; text-align: center; text-decoration: none; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-sec { background: #334155; color: #f8fafc; }
    .empty { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>KPSS P94 & Belediye İlan</h1>
    <div class="sub" id="durum">İlanlar yükleniyor...</div>
  </header>

  <div class="controls">
    <input type="text" id="ara" placeholder="Kurum, şehir veya kadro ara (örn: güvenlik, şoför)..." oninput="ciz()">
    <div class="tabs">
      <div class="tab active" onclick="filtreSec('HEPSI', this)">Tümü</div>
      <div class="tab" onclick="filtreSec('MULAKATSIZ', this)">Mülakatsız</div>
      <div class="tab" onclick="filtreSec('ISKUR', this)">İŞKUR / Belediye</div>
      <div class="tab" onclick="filtreSec('GUVENLIK', this)">Güvenlik</div>
    </div>
  </div>

  <div class="list" id="liste"></div>

  <script>
    let tumIlanlar = [];
    let aktifFiltre = 'HEPSI';

    function filtreSec(f, el) {
      aktifFiltre = f;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ciz();
    }

    function ciz() {
      const q = document.getElementById('ara').value.toLowerCase();
      const alan = document.getElementById('liste');
      const suzulen = tumIlanlar.filter(x => {
        const metin = (x.baslik + ' ' + x.kurum + ' ' + x.ozet).toLowerCase();
        if (q && !metin.includes(q)) return false;
        if (aktifFiltre === 'MULAKATSIZ' && !x.tur.toLowerCase().includes('mülakatsız')) return false;
        if (aktifFiltre === 'ISKUR' && !x.kurum.toLowerCase().includes('işkur')) return false;
        if (aktifFiltre === 'GUVENLIK' && !metin.includes('güvenlik')) return false;
        return true;
      });

      if (!suzulen.length) {
        alan.innerHTML = '<div class="empty">Eşleşen ilan bulunamadı.</div>';
        return;
      }

      alan.innerHTML = suzulen.map(x => `
        <div class="card">
          <div class="badge-row">
            <span class="badge">${x.kurum}</span>
            <span class="date">${x.tarih}</span>
          </div>
          <div class="title">${x.baslik}</div>
          <div class="meta">
            <span class="pill">🎯 ${x.puan}</span>
            <span class="pill">⚖️ ${x.tur}</span>
          </div>
          <div class="desc">${x.ozet}</div>
          <div class="btns">
            <a class="btn btn-primary" href="${x.link}" target="_blank">İlanı Aç</a>
            <a class="btn btn-sec" href="https://isealimkariyerkapisi.cbiko.gov.tr" target="_blank">Kariyer Kapısı</a>
          </div>
        </div>
      `).join('');
    }

    fetch('ilanlar.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        tumIlanlar = data;
        document.getElementById('durum').innerText = `Toplam ${data.length} aktif ilan takip ediliyor`;
        ciz();
      })
      .catch(() => {
        document.getElementById('durum').innerText = 'Henüz tarama tamamlanmadı';
        document.getElementById('liste').innerHTML = '<div class="empty">İlk tarama çalıştırıldığında ilanlar burada listelenecek.</div>';
      });
  </script>
</body>
</html>
